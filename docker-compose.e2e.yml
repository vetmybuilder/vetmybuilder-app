  # ── Next.js web servers (one per shard) ──────────────────────────────────────

  web-w0:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file:
      - path: ./web/.env.local
        required: false
    command: sh -lc "cd web && npx next dev -H 0.0.0.0 -p 3000"
    restart: unless-stopped
    depends_on:
      firebase:
        condition: service_healthy
      server-w0:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE: "http://server-w0:3100"
      NEXT_INTERNAL_API_BASE: "http://server-w0:3100"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NODE_ENV: development
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.request({host:'127.0.0.1',port:3000,path:'/',method:'GET'},res=>{process.exit(res.statusCode>=200&&res.statusCode<500?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>process.exit(1));req.end();\"",
