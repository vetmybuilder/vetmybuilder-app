  # ── Playwright shards ────────────────────────────────────────────────────────
  # pw-ui-1/2: chromium non-admin, shard 1/2 and 2/2
  # pw-ui-3/4: webkit non-admin, shard 1/2 and 2/2
  # pw-ui-5:   admin tests, chromium only

  pw-ui-1:
    build:
      context: .
      dockerfile: e2e-tests/Dockerfile
    env_file: [./.env]
    depends_on:
      mysql:
        condition: service_healthy
      server-w0:
        condition: service_healthy
      web-w0:
        condition: service_healthy
    environment:
      DOCKER: "1"
      START_WEB_SERVER: "0"
      PW_HEADLESS: "1"
      PW_WORKERS: "1"
      PW_TIMEOUT: "120000"
      TEST_TOTAL_SHARDS: "2"
      BASE_URL: "http://web-w0:3000"
      WEB_BASE_URL: "http://web-w0:3000"
      API_BASE_URL: "http://server-w0:3100"
      TEST_DB_HOST: "mysql"
      TEST_DB_PORT: "3306"
      TEST_DB_USER: "root"
      TEST_DB_PASSWORD: "root"
      TEST_DB_NAME: "vetmybuilder_test_s1_4_w0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
    command: >
      sh -lc
      "npx playwright test -c playwright.ui.config.ts tests/ui/account tests/ui/projects tests/ui/tradesman --project=ui-desktop-chromium --shard=1/2"
    networks: [e2e]

