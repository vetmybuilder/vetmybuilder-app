services:
  mysql:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [e2e]

  firebase:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    command: sh -lc "node scripts/dev-manual-firebase.js"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DOCKER: "1"
    ports:
      - "9099:9099"
      - "4400:4400"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(9099,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [e2e]

  web:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    command: sh -lc "cd web && npx next dev -H 0.0.0.0 -p 3000"
    depends_on:
      mysql:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE: "http://server-w0:3100"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks: [e2e]

  server-w0:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file: [./.env]
    command: sh -lc "TEST_TOTAL_SHARDS=4 TEST_SHARD=0 PORT=3100 TEST_ENV=e2e node scripts/dev-manual-server.js"
    depends_on:
      mysql:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      SQLITE_ENABLED: "0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "vetmybuilder_test_s1_4_w0"
    ports:
      - "3100:3100"
    networks: [e2e]

  server-w1:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file: [./.env]
    command: sh -lc "TEST_TOTAL_SHARDS=4 TEST_SHARD=1 PORT=3101 TEST_ENV=e2e node scripts/dev-manual-server.js"
    depends_on:
      mysql:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      SQLITE_ENABLED: "0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "vetmybuilder_test_s1_4_w1"
    ports:
      - "3101:3101"
    networks: [e2e]

  server-w2:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file: [./.env]
    command: sh -lc "TEST_TOTAL_SHARDS=4 TEST_SHARD=2 PORT=3102 TEST_ENV=e2e node scripts/dev-manual-server.js"
    depends_on:
      mysql:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      SQLITE_ENABLED: "0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "vetmybuilder_test_s1_4_w2"
    ports:
      - "3102:3102"
    networks: [e2e]

  server-w3:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file: [./.env]
    command: sh -lc "TEST_TOTAL_SHARDS=4 TEST_SHARD=3 PORT=3103 TEST_ENV=e2e node scripts/dev-manual-server.js"
    depends_on:
      mysql:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      SQLITE_ENABLED: "0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "vetmybuilder_test_s1_4_w3"
    ports:
      - "3103:3103"
    networks: [e2e]

  pw-ui-1:
    build:
      context: .
      dockerfile: e2e-tests/Dockerfile
    env_file: [./.env]
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started
      server-w0:
        condition: service_started
    environment:
      DOCKER: "1"
      START_WEB_SERVER: "0"
      PW_HEADLESS: "1"
      PW_WORKERS: "1"

      # IMPORTANT: ensure nothing inside the Playwright container uses localhost for the UI
      BASE_URL: "http://web:3000"
      WEB_BASE_URL: "http://web:3000"

      API_BASE_URL: "http://server-w0:3100"
      TEST_DB_HOST: "mysql"
      TEST_DB_PORT: "3306"
      TEST_DB_USER: "root"
      TEST_DB_PASSWORD: "root"
    command: >
      sh -lc
      "node -e \"const net=require('net');const wait=(h,p)=>new Promise(r=>{const t=setInterval(()=>{const s=net.connect(p,h,()=>{clearInterval(t);s.end();r();});s.on('error',()=>{});},250)});(async()=>{await wait('web',3000);await wait('server-w0',3100);process.exit(0)})()\" &&
       npx playwright test -c playwright.ui.config.ts tests/ui --shard=1/4"
    networks: [e2e]

  # pw-ui-2, 3, 4 remain identical except server and shard number
  # (your existing definitions are correct)

networks:
  e2e:
    driver: bridge