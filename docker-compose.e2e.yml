name: vetmybuilder-app

services:
  mysql:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [e2e]

  firebase:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    command: sh -lc "node scripts/dev-manual-firebase.js"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DOCKER: "1"
    ports:
      - "9099:9099"
      - "4400:4400"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(9099,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [e2e]

  # ── API servers (one per shard) ──────────────────────────────────────────────

  server-w0:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file:
      - ./.env
      - path: ./web/.env.local
        required: false
    command: sh -lc "TEST_TOTAL_SHARDS=2 TEST_SHARD=0 PORT=3100 TEST_ENV=e2e node scripts/dev-manual-server.js"
    depends_on:
      mysql:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      SQLITE_ENABLED: "0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "vetmybuilder_test_s1_4_w0"
    ports:
      - "3100:3100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.request({host:'127.0.0.1',port:3100,path:'/health',method:'GET'},res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>process.exit(1));req.end();\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [e2e]

  server-w1:
    build:
