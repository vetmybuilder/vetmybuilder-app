name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "E2E / shard-${{ matrix.shard.id }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let all shards run even if one fails
      matrix:
        shard:
          - id: 1
            args: "tests/ui/account tests/ui/projects tests/ui/tradesman --project=ui-desktop-chromium --shard=1/2"
            timeout: "120000"
          - id: 2
            args: "tests/ui/account tests/ui/projects tests/ui/tradesman --project=ui-desktop-chromium --shard=2/2"
            timeout: "120000"
          - id: 3
            args: "tests/ui/account tests/ui/projects tests/ui/tradesman --project=ui-mobile-webkit-iphone --shard=1/2"
            timeout: "180000"
          - id: 4
            args: "tests/ui/account tests/ui/projects tests/ui/tradesman --project=ui-mobile-webkit-iphone --shard=2/2"
            timeout: "180000"
          - id: 5
            args: "tests/ui/admin --project=ui-desktop-chromium"
            timeout: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Write secrets to the files the Docker images expect.
      # E2E_ENV  = full contents of the root .env file
      # E2E_WEB_ENV = full contents of web/.env.local
      - name: Write .env
        run: printf '%s' "$E2E_ENV" > .env
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}

      - name: Write web/.env.local
        run: printf '%s' "$E2E_WEB_ENV" > web/.env.local
        env:
          E2E_WEB_ENV: ${{ secrets.E2E_WEB_ENV }}

      - name: Build Docker images
        run: docker compose -f docker-compose.e2e.ci.yml build

      - name: Run E2E shard ${{ matrix.shard.id }}
        run: |
          docker compose -f docker-compose.e2e.ci.yml up \
            --exit-code-from pw-ui \
            --abort-on-container-exit
        env:
          PW_ARGS: ${{ matrix.shard.args }}
          PW_TIMEOUT: ${{ matrix.shard.timeout }}

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.ci.yml down --volumes --remove-orphans

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard.id }}
          path: e2e-tests/test-results/
          retention-days: 7

  api-tests:
    name: "Playwright API Tests / shard-${{ matrix.shard }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: printf '%s' "$E2E_ENV" > .env
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}

      - name: Write web/.env.local
        run: printf '%s' "$E2E_WEB_ENV" > web/.env.local
        env:
          E2E_WEB_ENV: ${{ secrets.E2E_WEB_ENV }}

      - name: Build Docker images
        run: docker compose -f docker-compose.e2e.api.ci.yml build

      - name: Run Playwright API tests (shard ${{ matrix.shard }}/5)
        run: |
          docker compose -f docker-compose.e2e.api.ci.yml up \
            --exit-code-from pw-api \
            --abort-on-container-exit
        env:
          PW_API_SHARD: "${{ matrix.shard }}/5"

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.api.ci.yml down --volumes --remove-orphans

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-shard-${{ matrix.shard }}
          path: e2e-tests/test-results/
          retention-days: 7

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e, api-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for app code changes
        id: changed
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -qvE '^e2e-tests/|^\.github/'; then
            echo "app=true" >> $GITHUB_OUTPUT
          else
            echo "app=false" >> $GITHUB_OUTPUT
            echo "Only e2e/workflow files changed — skipping deploy"
          fi

      - name: Prepare SSH
        if: steps.changed.outputs.app == 'true'
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        if: steps.changed.outputs.app == 'true'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "root@$PROD_HOST" "vmb-deploy"
          for i in {1..18}; do
            if curl -fsS https://vetmybuilder.com/health >/dev/null; then
              echo 'Health: OK'; exit 0
            fi
            sleep 5
          done
          echo 'Health: FAIL'; curl -i https://vetmybuilder.com/health; exit 1
