name: E2E Tests

on:
  pull_request:
    branches: [master]

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "Unit & Component Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=7168

  e2e:
    name: "E2E / shard-${{ matrix.shard.id }}"
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let all shards run even if one fails
      matrix:
        shard:
          # Chromium: 3 shards (includes admin in shard 3 alongside other tests)
          - id: 1
            args: "tests/ui --project=ui-desktop-chromium --shard=1/3"
            timeout: "120000"
          - id: 2
            args: "tests/ui --project=ui-desktop-chromium --shard=2/3"
            timeout: "120000"
          - id: 3
            args: "tests/ui --project=ui-desktop-chromium --shard=3/3"
            timeout: "120000"
          # Webkit: 3 shards (admin excluded via project config testIgnore)
          - id: 4
            args: "tests/ui --project=ui-mobile-webkit-iphone --shard=1/3"
            timeout: "120000"
          - id: 5
            args: "tests/ui --project=ui-mobile-webkit-iphone --shard=2/3"
            timeout: "120000"
          - id: 6
            args: "tests/ui --project=ui-mobile-webkit-iphone --shard=3/3"
            timeout: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Write secrets to the files the Docker images expect.
      # E2E_ENV  = full contents of the root .env file
      # E2E_WEB_ENV = full contents of web/.env.local
      - name: Write .env
        run: printf '%s' "$E2E_ENV" > .env
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}

      - name: Write web/.env.local
        run: printf '%s' "$E2E_WEB_ENV" > web/.env.local
        env:
          E2E_WEB_ENV: ${{ secrets.E2E_WEB_ENV }}

      - name: Set up Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-e2e-ui-${{ runner.os }}-${{ hashFiles('Dockerfile', 'Dockerfile.e2e', 'e2e-tests/package-lock.json', 'package-lock.json', 'server/**', 'web/**', 'e2e-tests/src/**', 'e2e-tests/tests/**') }}
          restore-keys: docker-e2e-ui-${{ runner.os }}-

      - name: Build Docker images
        run: docker compose -f docker-compose.e2e.ci.yml build

      - name: Run E2E shard ${{ matrix.shard.id }}
        # Hard step-level cap: if pw-ui hangs (test deadlock, infra
        # stall, etc.) GitHub kills this step after N minutes instead
        # of letting the whole job hit the 6-hour workflow timeout.
        # `if: always()` cleanup + upload steps below then run, so we
        # still get the test-results artifact for debugging.
        timeout-minutes: 25
        run: |
          docker compose -f docker-compose.e2e.ci.yml up \
            --exit-code-from pw-ui \
            --abort-on-container-exit
        env:
          PW_ARGS: ${{ matrix.shard.args }}
          PW_TIMEOUT: ${{ matrix.shard.timeout }}

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.ci.yml down --volumes --remove-orphans

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard.id }}
          path: e2e-tests/test-results/
          retention-days: 7

  api-tests:
    name: "Playwright API Tests / shard-${{ matrix.shard }}"
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: printf '%s' "$E2E_ENV" > .env
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}

      - name: Write web/.env.local
        run: printf '%s' "$E2E_WEB_ENV" > web/.env.local
        env:
          E2E_WEB_ENV: ${{ secrets.E2E_WEB_ENV }}

      - name: Set up Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-e2e-api-${{ runner.os }}-${{ hashFiles('Dockerfile', 'Dockerfile.e2e', 'e2e-tests/package-lock.json', 'package-lock.json', 'server/**', 'web/**', 'e2e-tests/src/**', 'e2e-tests/tests/**') }}
          restore-keys: docker-e2e-api-${{ runner.os }}-

      - name: Build Docker images
        run: docker compose -f docker-compose.e2e.api.ci.yml build

      - name: Run Playwright API tests (shard ${{ matrix.shard }}/2)
        run: |
          docker compose -f docker-compose.e2e.api.ci.yml up \
            --exit-code-from pw-api \
            --abort-on-container-exit
        env:
          PW_API_SHARD: "${{ matrix.shard }}/2"

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.api.ci.yml down --volumes --remove-orphans

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-shard-${{ matrix.shard }}
          path: e2e-tests/test-results/
          retention-days: 7

