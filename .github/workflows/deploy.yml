name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-to-vm
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "Unit & Component Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=7168

  deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for app code changes
        id: changed
        run: |
          # workflow_dispatch = manual trigger, always deploy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> $GITHUB_OUTPUT
            echo "Manual trigger - deploying"
            exit 0
          fi
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -qvE '^e2e-tests/|^\.github/'; then
            echo "app=true" >> $GITHUB_OUTPUT
          else
            echo "app=false" >> $GITHUB_OUTPUT
            echo "Only e2e/workflow files changed - skipping deploy"
          fi

      - name: Prepare SSH
        if: steps.changed.outputs.app == 'true'
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        if: steps.changed.outputs.app == 'true'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "root@$PROD_HOST" 'vmb-deploy-staging && for i in $(seq 1 18); do curl -fsS http://localhost:8788/health >/dev/null 2>&1 && echo "Staging health: OK" && exit 0; sleep 5; done; echo "Staging health: FAIL"; exit 1'

      - name: Deploy to Production
        if: steps.changed.outputs.app == 'true'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "root@$PROD_HOST" 'vmb-deploy && for i in $(seq 1 18); do curl -fsS http://localhost:8787/health >/dev/null 2>&1 && echo "Production health: OK" && exit 0; sleep 5; done; echo "Production health: FAIL"; exit 1'
