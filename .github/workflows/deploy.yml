name: Deploy to VM
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: deploy-to-vm, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH (decode key)
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Deploy (with health retry)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GH_PAT:   ${{ secrets.GH_PAT }}
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GH_PAT='$GH_PAT' sudo -E /usr/local/bin/vmb-deploy"
          # Retry health check for up to 90s
          for i in {1..18}; do
            if curl -fsS https://vetmybuilder.com/api/health >/dev/null; then
              echo 'Health: OK'; exit 0
            fi
            sleep 5
          done
          echo 'Health: FAIL'; curl -i https://vetmybuilder.com/api/health; exit 1
