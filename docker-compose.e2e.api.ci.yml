  pw-api:
    build:
      context: .
      dockerfile: e2e-tests/Dockerfile
    env_file: [./.env]
    depends_on:
      mysql:
        condition: service_healthy
      server-w0:
        condition: service_healthy
      server-w1:
        condition: service_healthy
      server-w2:
        condition: service_healthy
      server-w3:
        condition: service_healthy
    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      TEST_TOTAL_SHARDS: "4"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      TEST_DB_HOST: "mysql"
      TEST_DB_PORT: "3306"
      TEST_DB_USER: "root"
      TEST_DB_PASSWORD: "root"
      # TEST_DB_NAME intentionally omitted — each shard derives its own name
      # from TEST_DB_NAME_PREFIX + shard label (e.g. vetmybuilder_test_s1_4)
      PW_API_SHARD: ${PW_API_SHARD:-}
    command: >
      sh -lc
      "npx playwright test tests/api --project shard-1 --project shard-2 --project shard-3 --project shard-4 ${PW_API_SHARD:+--shard=$PW_API_SHARD}"
    networks: [e2e-api]

networks:
  e2e-api:
    driver: bridge
