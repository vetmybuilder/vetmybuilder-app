    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      LOG_LEVEL: "error"
      SQLITE_ENABLED: "0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "vetmybuilder_test_s2_4"
      # Test scenes use postcodes outside the pilot to verify near/far
