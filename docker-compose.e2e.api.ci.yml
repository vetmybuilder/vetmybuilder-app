# CI compose for Playwright API tests — 4 shards in a single job.
name: vetmybuilder-e2e-api-ci

services:
  mysql:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [e2e-api]

  firebase:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    command: sh -lc "node scripts/dev-manual-firebase.js"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DOCKER: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(9099,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [e2e-api]

  server-w0:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file:
      - ./.env
      - path: ./web/.env.local
        required: false
    command: sh -lc "TEST_TOTAL_SHARDS=4 TEST_SHARD=0 PORT=3100 TEST_ENV=e2e node scripts/dev-manual-server.js"
    depends_on:
      mysql:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      DOCKER: "1"
      TEST_ENV: "e2e"
      LOG_LEVEL: "error"
      SQLITE_ENABLED: "0"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "vetmybuilder_test_s1_4"
      # Test scenes use postcodes outside the pilot to verify near/far
      # location scoring - skip the pilot gate so those POSTs aren't 400'd.
      PILOT_AREAS_BYPASS: "1"
      # Open the project-type picker in E2E so disabled-at-launch
      # categories (Appliances/Flooring/etc) stay clickable in tests.
      PILOT_PROJECT_TYPES_OPEN: "1"
      # Feature flags default OFF with no seeded rows in E2E; open the ones
      # the suites exercise: homeowner signup (email + SSO) and payments
      # (unlock/subscription checkout). Honored only because TEST_ENV=e2e.
      FEATURE_HOMEOWNER_SIGNUP: "1"
      FEATURE_PAYMENTS: "1"
      # E2E cost guard — never let test runs hit billable external APIs.
      MOCK_EXTERNAL_SERVICES: "1"
      GOOGLE_PLACES_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      CH_KEY: ""
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.request({host:'127.0.0.1',port:3100,path:'/health',method:'GET'},res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>process.exit(1));req.end();\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [e2e-api]

  server-w1:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /app
    env_file:
