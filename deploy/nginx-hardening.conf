# nginx security hardening for VetMyBuilder
# =========================================
# These directives live on the Oracle VM, NOT in the deployed app bundle.
# Edit the prod site config and reload:
#
#   sudo nano /etc/nginx/sites-available/vetmybuilder
#   sudo nginx -t && sudo systemctl reload nginx
#
# (Repeat for /etc/nginx/sites-available/vetmybuilder-staging.)
#
# The standard response headers (HSTS, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy, CSP-Report-Only) are set by Next.js in
# web/next.config.mjs, so they are intentionally NOT duplicated here - setting
# them in both places produces duplicate headers. nginx only handles the parts
# that must live at the edge: forcing HTTPS, hiding the version banner, and
# stripping any stray upstream X-Powered-By.

# 1) Hide the "nginx/1.18.0 (Ubuntu)" version banner.
#    Put this in the http {} block of /etc/nginx/nginx.conf (preferred), or at
#    the top of the server {} block below.
server_tokens off;

# 2) Force all HTTP traffic to HTTPS with a 301.
#    Replace any existing `listen 80` server block with this one. The TLS
#    (listen 443 ssl) server block that Certbot manages stays as-is.
server {
    listen 80;
    listen [::]:80;
    server_name vetmybuilder.com www.vetmybuilder.com;
    return 301 https://vetmybuilder.com$request_uri;
}

# 3) Inside the existing `listen 443 ssl` server block, strip any upstream
#    X-Powered-By that slips through (belt-and-suspenders; Next.js already
#    drops its own via poweredByHeader:false). Add alongside the proxy_pass:
#
#    proxy_hide_header X-Powered-By;
